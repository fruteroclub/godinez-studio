name: Auto-add to project

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/fruteroclub/projects/5
          github-token: ${{ secrets.PROJECT_TOKEN }}
